name: Continuidad de audio (30 minutos)

on:
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:audio
        env:
          AUDIO_LONG: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-continuity-30min
          path: |
            playwright-report/
            test-results/
          retention-days: 14
