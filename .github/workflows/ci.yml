name: Integración Continua

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificación (Tipos, Lint, Pruebas y Build)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos estáticos
        run: npm run typecheck

      - name: Análisis estático (Lint)
        run: npm run lint

      - name: Pruebas unitarias y cobertura
        run: npm run test:coverage

      - name: Construcción de la aplicación
        run: npm run build

      - name: Verificar artefacto de construcción
        run: test -f dist/index.html

      - name: Instalar navegadores para E2E
        run: npx playwright install --with-deps chrome msedge

      - name: Recorridos E2E en Chrome y Edge
        run: npm run test:e2e

      - name: Continuidad de audio durante 60 segundos
        run: npm run test:audio

      - name: Conservar informes de navegador y evidencia de audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 14
